  body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }

  a.card:hover { border-color:var(--accent); }
  a.card h2 { margin:0 0 .35rem; font-size:1.15rem; color:var(--accent); }
  a.card p { margin:0; font-size:.95rem; }
</style>
